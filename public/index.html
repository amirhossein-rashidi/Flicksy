<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070714">
  <title>Flicksy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #070714;
      color: #e8e8f5;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      padding: 16px 16px 40px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #b44dff, #6a5cff);
      object-fit: cover; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff;
    }
    .hello { font-size: 15px; color: #a7a7c4; }
    .hello b { display: block; color: #fff; font-size: 17px; }
    .brand {
      margin-inline-start: auto;
      font-size: 22px; font-weight: 800; letter-spacing: .5px;
      background: linear-gradient(135deg, #b44dff, #6a5cff 55%, #a9b4ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      direction: ltr;
    }
    .search {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .search:focus { border-color: #8a6bff; }
    .search::placeholder { color: #7b7b9a; }
    #msg { margin: 18px 4px; color: #a7a7c4; font-size: 14px; text-align: center; }
    #msg.error { color: #ff9a9a; }
    ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
    li {
      display: flex; gap: 12px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
    }
    .poster {
      width: 56px; height: 84px; border-radius: 8px; flex: none;
      background: rgba(255,255,255,.08); object-fit: cover;
    }
    .info { min-width: 0; flex: 1; }
    .title { font-size: 16px; font-weight: 700; margin: 0 0 2px; color: #fff; }
    .orig { font-size: 12px; color: #8d8dac; direction: ltr; text-align: start; margin: 0 0 6px; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #a7a7c4; }
    .badge { padding: 1px 8px; border-radius: 999px; background: rgba(138,107,255,.2); color: #c9bcff; }
    .ov {
      margin: 6px 0 0; font-size: 12px; line-height: 1.7; color: #9a9ab8;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    footer { margin-top: 28px; font-size: 11px; line-height: 1.8; color: #6f6f8d; text-align: center; direction: ltr; }
  </style>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="avatar" id="avatar">F</div>
      <div class="hello"><span id="hello-small">سلام</span><b id="hello-name">...</b></div>
      <div class="brand">Flicksy</div>
    </header>

    <input id="q" class="search" type="search" inputmode="search" autocomplete="off"
           placeholder="جست‌وجوی فیلم یا سریال…" disabled>
    <div id="msg">در حال ورود…</div>
    <ul id="results"></ul>

    <footer>
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>
  </div>

  <script>
    (function () {
      var qEl = document.getElementById("q");
      var msgEl = document.getElementById("msg");
      var listEl = document.getElementById("results");
      var nameEl = document.getElementById("hello-name");
      var avatarEl = document.getElementById("avatar");
      var initData = "";
      var timer = null;
      var controller = null;

      function setMsg(text, isError) {
        msgEl.textContent = text || "";
        msgEl.className = isError ? "error" : "";
        msgEl.style.display = text ? "block" : "none";
      }

      function readInitData() {
        try {
          var h = new URLSearchParams(location.hash.replace(/^#/, ""));
          var fromHash = h.get("tgWebAppData");
          if (fromHash) return fromHash;
        } catch (e) {}
        try {
          if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) {
            return Telegram.WebApp.initData;
          }
        } catch (e) {}
        return "";
      }

      function api(path, signal) {
        return fetch(path, {
          headers: { Authorization: "tma " + initData },
          signal: signal
        }).then(function (r) {
          return r.json().then(function (data) { return { status: r.status, data: data }; });
        });
      }

      function authError(data) {
        if (data && data.error === "expired") {
          return "نشست منقضی شده؛ برنامه را دوباره از تلگرام باز کن.";
        }
        return "ورود ناموفق بود. برنامه را دوباره از تلگرام باز کن.";
      }

      function render(results) {
        listEl.textContent = "";
        results.forEach(function (r) {
          var li = document.createElement("li");

          var poster = document.createElement(r.poster ? "img" : "div");
          poster.className = "poster";
          if (r.poster) { poster.src = r.poster; poster.alt = ""; poster.loading = "lazy"; }

          var info = document.createElement("div");
          info.className = "info";

          var t = document.createElement("p");
          t.className = "title";
          t.textContent = r.title || r.original_title;
          info.appendChild(t);

          if (r.original_title && r.original_title !== r.title) {
            var o = document.createElement("p");
            o.className = "orig";
            o.textContent = r.original_title;
            info.appendChild(o);
          }

          var meta = document.createElement("div");
          meta.className = "meta";
          var badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = r.media_type === "tv" ? "سریال" : "فیلم";
          meta.appendChild(badge);
          if (r.year) {
            var y = document.createElement("span");
            y.textContent = String(r.year);
            meta.appendChild(y);
          }
          if (r.rating) {
            var s = document.createElement("span");
            s.textContent = "★ " + r.rating;
            meta.appendChild(s);
          }
          info.appendChild(meta);

          if (r.overview) {
            var ov = document.createElement("p");
            ov.className = "ov";
            ov.textContent = r.overview;
            info.appendChild(ov);
          }

          li.appendChild(poster);
          li.appendChild(info);
          listEl.appendChild(li);
        });
      }

      function search(text) {
        if (controller) controller.abort();
        controller = new AbortController();
        setMsg("در حال جست‌وجو…");
        api("/api/search?q=" + encodeURIComponent(text), controller.signal)
          .then(function (res) {
            if (res.status === 401) { setMsg(authError(res.data), true); return; }
            if (res.status !== 200) { setMsg("جست‌وجو فعلاً در دسترس نیست. کمی بعد دوباره امتحان کن.", true); return; }
            var results = res.data.results || [];
            render(results);
            setMsg(results.length ? "" : "نتیجه‌ای پیدا نشد.");
          })
          .catch(function (e) {
            if (e && e.name === "AbortError") return;
            setMsg("اتصال برقرار نشد. اینترنت را بررسی کن.", true);
          });
      }

      qEl.addEventListener("input", function () {
        clearTimeout(timer);
        var text = qEl.value.trim();
        if (text.length < 2) {
          if (controller) controller.abort();
          listEl.textContent = "";
          setMsg("حداقل دو حرف بنویس.");
          return;
        }
        timer = setTimeout(function () { search(text); }, 400);
      });

      function start(attempt) {
        initData = readInitData();
        if (!initData) {
          if (attempt < 6) { setTimeout(function () { start(attempt + 1); }, 300); return; }
          setMsg("Flicksy را از داخل تلگرام و از طریق ربات باز کن.", true);
          return;
        }
        api("/api/me").then(function (res) {
          if (res.status !== 200) { setMsg(authError(res.data), true); return; }
          var u = res.data.user;
          nameEl.textContent = u.display_name;
          if (u.photo_url) {
            var img = document.createElement("img");
            img.className = "avatar";
            img.id = "avatar";
            img.alt = "";
            img.src = u.photo_url;
            avatarEl.replaceWith(img);
            avatarEl = img;
          } else {
            avatarEl.textContent = (u.display_name || "F").charAt(0).toUpperCase();
          }
          qEl.disabled = false;
          setMsg("چیزی را جست‌وجو کن، مثلاً نام یک فیلم.");
        }).catch(function () {
          setMsg("اتصال به سرور برقرار نشد.", true);
        });
      }

      window.addEventListener("load", function () {
        try {
          if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
          }
        } catch (e) {}
      });

      start(0);
    })();
  </script>
</body>
</html>
