<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flicksy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #070714;
      color: #e8e8f5;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 {
      margin: 0;
      font-size: 56px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #b44dff, #6a5cff 55%, #a9b4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 0; color: #a7a7c4; }
    #status { font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Flicksy</h1>
  <p>به‌زودی؛ فیلم و سریال با دوستان</p>
  <p id="status">در حال بررسی اتصال…</p>
  <script>
    fetch("/api/health")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById("status").textContent =
          d.db === "ok" ? "سرور و دیتابیس متصل‌اند ✓" : "سرور بالاست، دیتابیس مشکل دارد";
      })
      .catch(function () {
        document.getElementById("status").textContent = "اتصال به سرور برقرار نشد";
      });
  </script>
</body>
</html>
