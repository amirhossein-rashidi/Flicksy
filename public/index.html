<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070714">
  <title>Flicksy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #070714;
      color: #e8e8f5;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      padding: 16px 16px 40px;
    }
    body.locked { overflow: hidden; }
    button { font-family: inherit; }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #b44dff, #6a5cff);
      object-fit: cover; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff;
    }
    .hello { font-size: 15px; color: #a7a7c4; }
    .hello b { display: block; color: #fff; font-size: 17px; }
    .brand {
      margin-inline-start: auto;
      font-size: 22px; font-weight: 800; letter-spacing: .5px;
      background: linear-gradient(135deg, #b44dff, #6a5cff 55%, #a9b4ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      direction: ltr;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 11px 8px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: #a7a7c4;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .tab.active { background: rgba(138,107,255,.22); border-color: #8a6bff; color: #fff; }
    .search {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06); color: #fff;
      font-size: 16px; outline: none;
    }
    .search:focus { border-color: #8a6bff; }
    .search::placeholder { color: #7b7b9a; }
    .msg { margin: 18px 4px; color: #a7a7c4; font-size: 14px; text-align: center; }
    .msg.error { color: #ff9a9a; }
    .hidden { display: none !important; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip {
      flex: none; padding: 7px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: #a7a7c4;
      font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: rgba(138,107,255,.25); border-color: #8a6bff; color: #fff; }
    ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
    li {
      display: flex; gap: 12px; padding: 10px; border-radius: 14px; cursor: pointer;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    }
    li:active { background: rgba(255,255,255,.09); }
    .poster {
      width: 56px; height: 84px; border-radius: 8px; flex: none;
      background: rgba(255,255,255,.08); object-fit: cover;
    }
    .info { min-width: 0; flex: 1; }
    .title { font-size: 16px; font-weight: 700; margin: 0 0 2px; color: #fff; }
    .orig { font-size: 12px; color: #8d8dac; direction: ltr; text-align: start; margin: 0 0 6px; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: #a7a7c4; }
    .badge { padding: 1px 8px; border-radius: 999px; background: rgba(138,107,255,.2); color: #c9bcff; }
    .mine { padding: 1px 8px; border-radius: 999px; background: rgba(80,200,140,.18); color: #9be8c2; }
    .ov {
      margin: 6px 0 0; font-size: 12px; line-height: 1.7; color: #9a9ab8;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    footer { margin-top: 28px; font-size: 11px; line-height: 1.8; color: #6f6f8d; text-align: center; direction: ltr; }

    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: flex-end; justify-content: center; z-index: 10;
    }
    #sheet {
      width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
      background: #12122a; border-top-left-radius: 22px; border-top-right-radius: 22px;
      border: 1px solid rgba(255,255,255,.1); border-bottom: none;
      padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    }
    .sheet-head { display: flex; gap: 12px; margin-bottom: 16px; }
    .sheet-head .title { font-size: 18px; }
    .label { font-size: 13px; color: #a7a7c4; margin: 14px 2px 8px; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pills.nums { direction: ltr; }
    .pill {
      padding: 9px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05); color: #d6d6ea; font-size: 14px;
    }
    .pill.sel { background: linear-gradient(135deg, #8a4dff, #5b5cff); border-color: transparent; color: #fff; }
    .nums .pill { min-width: 40px; text-align: center; padding: 9px 0; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
      font-size: 15px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #8a4dff, #5b5cff);
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.ghost { background: rgba(255,255,255,.07); color: #d6d6ea; font-weight: 600; }
    .btn.danger { background: rgba(255,90,90,.15); color: #ff9a9a; font-weight: 600; flex: 0 0 auto; padding: 13px 16px; }
  </style>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="avatar" id="avatar">F</div>
      <div class="hello"><span>سلام</span><b id="hello-name">...</b></div>
      <div class="brand">Flicksy</div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tab-search" type="button">جست‌وجو</button>
      <button class="tab" id="tab-library" type="button">کتابخانه من</button>
    </div>

    <section id="view-search">
      <input id="q" class="search" type="search" inputmode="search" autocomplete="off"
             placeholder="جست‌وجوی فیلم یا سریال…" disabled>
      <div id="msg" class="msg">در حال ورود…</div>
      <ul id="results"></ul>
    </section>

    <section id="view-library" class="hidden">
      <div id="chips" class="chips"></div>
      <div id="lib-msg" class="msg hidden"></div>
      <ul id="lib-results"></ul>
    </section>

    <footer>
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>
  </div>

  <div id="overlay" class="hidden">
    <div id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div id="sheet-poster" class="poster"></div>
        <div class="info">
          <p class="title" id="sheet-title"></p>
          <p class="orig" id="sheet-orig"></p>
          <div class="meta" id="sheet-meta"></div>
        </div>
      </div>
      <div class="label">وضعیت</div>
      <div class="pills" id="statuses"></div>
      <div class="label">امتیاز من</div>
      <div class="pills nums" id="ratings"></div>
      <div id="sheet-msg" class="msg error hidden"></div>
      <div class="actions">
        <button class="btn" id="save" type="button" disabled>ذخیره</button>
        <button class="btn danger hidden" id="remove" type="button">حذف</button>
        <button class="btn ghost" id="close" type="button">بستن</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var STATUS_ORDER = ["want", "watching", "watched", "paused", "dropped"];
      var STATUS_LABEL = {
        want: "می‌خواهم ببینم",
        watching: "در حال تماشا",
        watched: "دیده‌ام",
        paused: "متوقف‌شده",
        dropped: "رهاشده"
      };

      var $ = function (id) { return document.getElementById(id); };
      var qEl = $("q"), msgEl = $("msg"), listEl = $("results");
      var libMsgEl = $("lib-msg"), libListEl = $("lib-results"), chipsEl = $("chips");
      var nameEl = $("hello-name"), avatarEl = $("avatar");

      var initData = "";
      var timer = null, controller = null;
      var searchResults = [];
      var libFilter = null, libStale = true, libLoading = false;
      var sheetItem = null, selStatus = null, selRating = null, saving = false;

      // ---------- small helpers ----------
      function setMsg(el, text, isError) {
        el.textContent = text || "";
        el.classList.toggle("error", !!isError);
        el.classList.toggle("hidden", !text);
      }

      function readInitData() {
        try {
          var h = new URLSearchParams(location.hash.replace(/^#/, ""));
          var fromHash = h.get("tgWebAppData");
          if (fromHash) return fromHash;
        } catch (e) {}
        try {
          if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) {
            return Telegram.WebApp.initData;
          }
        } catch (e) {}
        return "";
      }

      function api(path, options) {
        options = options || {};
        var headers = { Authorization: "tma " + initData };
        var init = { method: options.method || "GET", headers: headers, signal: options.signal };
        if (options.body !== undefined) {
          headers["Content-Type"] = "application/json";
          init.body = JSON.stringify(options.body);
        }
        return fetch(path, init).then(function (r) {
          return r.json().then(function (data) { return { status: r.status, data: data }; });
        });
      }

      function authError(data) {
        if (data && data.error === "expired") {
          return "نشست منقضی شده؛ برنامه را دوباره از تلگرام باز کن.";
        }
        return "ورود ناموفق بود. برنامه را دوباره از تلگرام باز کن.";
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function posterNode(item, className) {
        var node = el(item.poster ? "img" : "div", className || "poster");
        if (item.poster) { node.src = item.poster; node.alt = ""; node.loading = "lazy"; }
        return node;
      }

      function mineText(item) {
        if (!item.status) return "";
        var t = STATUS_LABEL[item.status] || "";
        if (item.my_rating) t += " · ★ " + item.my_rating;
        return t;
      }

      function fillMeta(container, item) {
        container.textContent = "";
        container.appendChild(el("span", "badge", item.media_type === "tv" ? "سریال" : "فیلم"));
        if (item.year) container.appendChild(el("span", "", String(item.year)));
        if (item.rating) container.appendChild(el("span", "", "★ " + item.rating));
        var mine = mineText(item);
        if (mine) container.appendChild(el("span", "mine", mine));
      }

      function card(item, withOverview) {
        var li = el("li");
        li.appendChild(posterNode(item));
        var info = el("div", "info");
        info.appendChild(el("p", "title", item.title || item.original_title));
        if (item.original_title && item.original_title !== item.title) {
          info.appendChild(el("p", "orig", item.original_title));
        }
        var meta = el("div", "meta");
        fillMeta(meta, item);
        info.appendChild(meta);
        if (withOverview && item.overview) info.appendChild(el("p", "ov", item.overview));
        li.appendChild(info);
        li.addEventListener("click", function () { openSheet(item); });
        return li;
      }

      // ---------- search ----------
      function renderSearch() {
        listEl.textContent = "";
        searchResults.forEach(function (r) { listEl.appendChild(card(r, true)); });
      }

      function search(text) {
        if (controller) controller.abort();
        controller = new AbortController();
        setMsg(msgEl, "در حال جست‌وجو…");
        api("/api/search?q=" + encodeURIComponent(text), { signal: controller.signal })
          .then(function (res) {
            if (res.status === 401) { setMsg(msgEl, authError(res.data), true); return; }
            if (res.status !== 200) {
              setMsg(msgEl, "جست‌وجو فعلاً در دسترس نیست. کمی بعد دوباره امتحان کن.", true);
              return;
            }
            searchResults = res.data.results || [];
            renderSearch();
            setMsg(msgEl, searchResults.length ? "" : "نتیجه‌ای پیدا نشد.");
          })
          .catch(function (e) {
            if (e && e.name === "AbortError") return;
            setMsg(msgEl, "اتصال برقرار نشد. اینترنت را بررسی کن.", true);
          });
      }

      qEl.addEventListener("input", function () {
        clearTimeout(timer);
        var text = qEl.value.trim();
        if (text.length < 2) {
          if (controller) controller.abort();
          searchResults = [];
          listEl.textContent = "";
          setMsg(msgEl, "حداقل دو حرف بنویس.");
          return;
        }
        timer = setTimeout(function () { search(text); }, 400);
      });

      // ---------- library ----------
      function renderChips(counts) {
        chipsEl.textContent = "";
        var total = 0;
        STATUS_ORDER.forEach(function (s) { total += counts[s] || 0; });

        function addChip(label, value) {
          var c = el("button", "chip" + (libFilter === value ? " active" : ""), label);
          c.type = "button";
          c.addEventListener("click", function () {
            libFilter = value;
            loadLibrary();
          });
          chipsEl.appendChild(c);
        }
        addChip("همه (" + total + ")", null);
        STATUS_ORDER.forEach(function (s) {
          addChip(STATUS_LABEL[s] + " (" + (counts[s] || 0) + ")", s);
        });
      }

      function loadLibrary() {
        if (libLoading) return;
        libLoading = true;
        setMsg(libMsgEl, "در حال بارگذاری…");
        var path = "/api/library" + (libFilter ? "?status=" + libFilter : "");
        api(path).then(function (res) {
          libLoading = false;
          if (res.status === 401) { setMsg(libMsgEl, authError(res.data), true); return; }
          if (res.status !== 200) { setMsg(libMsgEl, "بارگذاری کتابخانه ممکن نشد.", true); return; }
          libStale = false;
          renderChips(res.data.counts || {});
          libListEl.textContent = "";
          var items = res.data.items || [];
          items.forEach(function (it) { libListEl.appendChild(card(it, false)); });
          setMsg(libMsgEl, items.length ? "" : "اینجا هنوز چیزی نیست. از تب جست‌وجو اضافه کن.");
        }).catch(function () {
          libLoading = false;
          setMsg(libMsgEl, "اتصال برقرار نشد.", true);
        });
      }

      // ---------- tabs ----------
      function showTab(name) {
        var isSearch = name === "search";
        $("view-search").classList.toggle("hidden", !isSearch);
        $("view-library").classList.toggle("hidden", isSearch);
        $("tab-search").classList.toggle("active", isSearch);
        $("tab-library").classList.toggle("active", !isSearch);
        if (!isSearch && libStale) loadLibrary();
      }
      $("tab-search").addEventListener("click", function () { showTab("search"); });
      $("tab-library").addEventListener("click", function () { showTab("library"); });

      // ---------- bottom sheet ----------
      function buildSheetButtons() {
        var st = $("statuses");
        st.textContent = "";
        STATUS_ORDER.forEach(function (s) {
          var b = el("button", "pill" + (selStatus === s ? " sel" : ""), STATUS_LABEL[s]);
          b.type = "button";
          b.addEventListener("click", function () { selStatus = s; buildSheetButtons(); });
          st.appendChild(b);
        });

        var rt = $("ratings");
        rt.textContent = "";
        for (var n = 1; n <= 10; n++) {
          (function (num) {
            var b = el("button", "pill" + (selRating === num ? " sel" : ""), String(num));
            b.type = "button";
            b.addEventListener("click", function () {
              selRating = selRating === num ? null : num;
              buildSheetButtons();
            });
            rt.appendChild(b);
          })(n);
        }
        $("save").disabled = !selStatus || saving;
      }

      function openSheet(item) {
        sheetItem = item;
        selStatus = item.status || null;
        selRating = item.my_rating || null;
        saving = false;

        var p = $("sheet-poster");
        var newPoster = posterNode(item);
        newPoster.id = "sheet-poster";
        p.replaceWith(newPoster);

        $("sheet-title").textContent = item.title || item.original_title;
        var orig = item.original_title && item.original_title !== item.title ? item.original_title : "";
        $("sheet-orig").textContent = orig;
        $("sheet-orig").classList.toggle("hidden", !orig);
        fillMeta($("sheet-meta"), item);
        setMsg($("sheet-msg"), "");
        $("remove").classList.toggle("hidden", !item.status);

        buildSheetButtons();
        $("overlay").classList.remove("hidden");
        document.body.classList.add("locked");
      }

      function closeSheet() {
        $("overlay").classList.add("hidden");
        document.body.classList.remove("locked");
        sheetItem = null;
      }

      function syncItem(tmdbId, mediaType, status, myRating) {
        searchResults.forEach(function (r) {
          if (r.tmdb_id === tmdbId && r.media_type === mediaType) {
            r.status = status;
            r.my_rating = myRating;
          }
        });
        renderSearch();
        libStale = true;
        if (!$("view-library").classList.contains("hidden")) loadLibrary();
      }

      $("save").addEventListener("click", function () {
        if (!sheetItem || !selStatus || saving) return;
        saving = true;
        $("save").disabled = true;
        $("save").textContent = "در حال ذخیره…";
        var item = sheetItem;
        api("/api/library", {
          method: "PUT",
          body: { tmdb_id: item.tmdb_id, media_type: item.media_type, status: selStatus, rating: selRating }
        }).then(function (res) {
          saving = false;
          $("save").textContent = "ذخیره";
          if (res.status === 200) {
            item.status = res.data.status;
            item.my_rating = res.data.my_rating;
            syncItem(item.tmdb_id, item.media_type, item.status, item.my_rating);
            closeSheet();
          } else if (res.status === 401) {
            setMsg($("sheet-msg"), authError(res.data), true);
            $("save").disabled = false;
          } else {
            setMsg($("sheet-msg"), "ذخیره نشد. کمی بعد دوباره امتحان کن.", true);
            $("save").disabled = false;
          }
        }).catch(function () {
          saving = false;
          $("save").textContent = "ذخیره";
          $("save").disabled = false;
          setMsg($("sheet-msg"), "اتصال برقرار نشد.", true);
        });
      });

      $("remove").addEventListener("click", function () {
        if (!sheetItem || saving) return;
        saving = true;
        var item = sheetItem;
        api("/api/library?tmdb_id=" + item.tmdb_id + "&media_type=" + item.media_type, { method: "DELETE" })
          .then(function (res) {
            saving = false;
            if (res.status === 200) {
              item.status = null;
              item.my_rating = null;
              syncItem(item.tmdb_id, item.media_type, null, null);
              closeSheet();
            } else {
              setMsg($("sheet-msg"), "حذف نشد. کمی بعد دوباره امتحان کن.", true);
            }
          }).catch(function () {
            saving = false;
            setMsg($("sheet-msg"), "اتصال برقرار نشد.", true);
          });
      });

      $("close").addEventListener("click", closeSheet);
      $("overlay").addEventListener("click", function (e) {
        if (e.target === $("overlay")) closeSheet();
      });

      // ---------- start ----------
      function start(attempt) {
        initData = readInitData();
        if (!initData) {
          if (attempt < 6) { setTimeout(function () { start(attempt + 1); }, 300); return; }
          setMsg(msgEl, "Flicksy را از داخل تلگرام و از طریق ربات باز کن.", true);
          return;
        }
        api("/api/me").then(function (res) {
          if (res.status !== 200) { setMsg(msgEl, authError(res.data), true); return; }
          var u = res.data.user;
          nameEl.textContent = u.display_name;
          if (u.photo_url) {
            var img = el("img", "avatar");
            img.id = "avatar";
            img.alt = "";
            img.src = u.photo_url;
            avatarEl.replaceWith(img);
            avatarEl = img;
          } else {
            avatarEl.textContent = (u.display_name || "F").charAt(0).toUpperCase();
          }
          qEl.disabled = false;
          setMsg(msgEl, "چیزی را جست‌وجو کن، مثلاً نام یک فیلم.");
        }).catch(function () {
          setMsg(msgEl, "اتصال به سرور برقرار نشد.", true);
        });
      }

      window.addEventListener("load", function () {
        try {
          if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
          }
        } catch (e) {}
      });

      start(0);
    })();
  </script>
</body>
</html>
